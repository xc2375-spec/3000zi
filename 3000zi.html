<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#b22222">
<title>3000常用字 测验 · 复习</title>
<style>
:root{
  --bg:#faf6f1;
  --paper:#ffffff;
  --ink:#1a1a1a;
  --sub:#666;
  --line:#e8e1d6;
  --accent:#b22222;
  --accent-soft:#f7e5e3;
  --green:#2f7d32;
  --green-soft:#e6f3e6;
  --amber:#b07a1a;
  --amber-soft:#fbf0d6;
  --blue:#2c5282;
  --blue-soft:#e6eef7;
  --gray-soft:#efece7;
  --shadow:0 2px 12px rgba(50,30,15,.06);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#1a1816;
    --paper:#252320;
    --ink:#f0ebe2;
    --sub:#a39a8a;
    --line:#3a3631;
    --accent-soft:#3a2422;
    --green-soft:#1f3320;
    --amber-soft:#3a2e16;
    --blue-soft:#1f2a3a;
    --gray-soft:#2c2926;
    --shadow:0 2px 12px rgba(0,0,0,.3);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
button{font-family:inherit;font-size:inherit;border:none;background:none;cursor:pointer;color:inherit}
.app{max-width:780px;margin:0 auto;padding:env(safe-area-inset-top) 0 calc(72px + env(safe-area-inset-bottom)) 0;min-height:100vh}
header{padding:14px 20px 10px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0;z-index:10;backdrop-filter:blur(10px);background:color-mix(in srgb,var(--bg) 90%,transparent)}
header h1{margin:0;font-size:18px;font-weight:600;letter-spacing:.5px}
header h1 .sub{font-weight:400;color:var(--sub);font-size:13px;margin-left:8px}
.icon-btn{padding:8px;border-radius:10px;font-size:18px}
.icon-btn:hover{background:var(--gray-soft)}

main{padding:16px 20px}
.view{display:none}
.view.active{display:block}

/* Tabs / bottom nav */
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--paper);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 0 calc(8px + env(safe-area-inset-bottom));z-index:20}
nav.tabs .tab{flex:1;text-align:center;padding:6px 0;color:var(--sub);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:8px}
nav.tabs .tab .ic{font-size:20px;line-height:1}
nav.tabs .tab.active{color:var(--accent)}
nav.tabs .tab .badge{position:absolute;background:var(--accent);color:#fff;font-size:10px;border-radius:10px;padding:1px 5px;margin-top:-26px;margin-left:18px;min-width:14px}

/* Cards */
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:14px;box-shadow:var(--shadow)}
.row{display:flex;gap:10px;align-items:center}
.spacer{flex:1}
.muted{color:var(--sub);font-size:13px}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;background:var(--gray-soft);color:var(--sub);font-size:12px;margin-right:6px}
.tag.accent{background:var(--accent-soft);color:var(--accent)}
.tag.green{background:var(--green-soft);color:var(--green)}
.tag.amber{background:var(--amber-soft);color:var(--amber)}
.tag.blue{background:var(--blue-soft);color:var(--blue)}

/* Quiz / review character display */
.char-stage{text-align:center;padding:30px 0 24px}
.char-stage .freq{color:var(--sub);font-size:13px;margin-bottom:6px}
.char-stage .glyph{font-size:140px;font-weight:500;line-height:1;letter-spacing:2px;font-family:"Songti SC","STSong","Source Han Serif SC",serif;color:var(--ink)}
.char-stage .variant{color:var(--sub);font-size:14px;margin-top:8px}
@media (max-width:380px){
  .char-stage .glyph{font-size:110px}
}
@media (min-width:768px){
  .char-stage .glyph{font-size:180px}
}

.reveal{margin-top:6px;border-top:1px dashed var(--line);padding-top:18px}
.reveal .pinyin{font-size:22px;color:var(--accent);font-weight:500;letter-spacing:.5px}
.reveal .pron-block{margin-bottom:12px}
.reveal .pron-block .pinyin-line{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
.reveal .pron-block .pinyin-line .py{font-size:18px;color:var(--accent);font-weight:500}
.reveal .meaning{color:var(--ink);font-size:15px;margin:4px 0 8px;line-height:1.6}
.reveal .examples{font-size:15px;line-height:1.7;color:var(--ink)}
.reveal .examples .zh{font-weight:500}
.reveal .examples .py{color:var(--accent);font-size:13px;margin:0 4px}
.reveal .def-list{margin:6px 0 10px 0;padding-left:0;list-style:none}
.reveal .def-list li{padding:4px 0 4px 18px;position:relative;font-size:15px;line-height:1.55;color:var(--ink)}
.reveal .def-list li::before{content:"";position:absolute;left:6px;top:14px;width:5px;height:5px;border-radius:50%;background:var(--accent);opacity:.65}
.reveal .ex-label{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--sub);margin:10px 0 4px}
.reveal .src-tag{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--sub);background:var(--gray-soft);padding:1px 6px;border-radius:4px;margin-left:8px;vertical-align:middle}

.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.btn-row.three{grid-template-columns:1fr 1fr 1fr}
.btn-row.four{grid-template-columns:repeat(4,1fr)}
.btn{padding:14px 12px;border-radius:14px;font-size:15px;font-weight:600;border:1px solid transparent;transition:transform .05s ease,background .15s ease;text-align:center}
.btn:active{transform:scale(.97)}
.btn-know{background:var(--green-soft);color:var(--green)}
.btn-unknown{background:var(--accent-soft);color:var(--accent)}
.btn-skip{background:var(--gray-soft);color:var(--sub)}
.btn-add{background:var(--blue-soft);color:var(--blue)}
.btn-pri{background:var(--ink);color:var(--paper)}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}

.btn-srs{padding:12px 6px;border-radius:12px;font-weight:600;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:2px}
.btn-srs .lbl{font-size:14px}
.btn-srs .nxt{font-size:11px;font-weight:400;opacity:.75}
.btn-again{background:var(--accent-soft);color:var(--accent)}
.btn-hard{background:var(--amber-soft);color:var(--amber)}
.btn-good{background:var(--green-soft);color:var(--green)}
.btn-easy{background:var(--blue-soft);color:var(--blue)}

/* Stats */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat-card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:center}
.stat-card .num{font-size:28px;font-weight:600;color:var(--ink)}
.stat-card .lbl{color:var(--sub);font-size:12px;margin-top:4px}
.bar{height:8px;background:var(--gray-soft);border-radius:999px;overflow:hidden;margin-top:10px}
.bar > span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--amber));border-radius:999px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin-top:10px}
.legend .dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:middle}

/* Settings */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:13px;color:var(--sub)}
.field input[type="number"], .field select{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);font-size:15px;width:100%}
.range-row{display:flex;gap:8px;align-items:center}
.range-row input{flex:1}
.toggle{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.toggle:last-child{border-bottom:none}
.switch{position:relative;width:44px;height:26px;background:var(--gray-soft);border-radius:999px;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;background:var(--paper);border-radius:50%;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch.on{background:var(--green)}
.switch.on::after{left:21px}

/* Empty state */
.empty{text-align:center;padding:60px 20px;color:var(--sub)}
.empty .ic{font-size:48px;margin-bottom:12px;opacity:.5}
.empty h3{margin:8px 0;color:var(--ink);font-weight:500}

/* Toast */
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:30}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}

.section-title{font-size:13px;color:var(--sub);text-transform:uppercase;letter-spacing:.6px;margin:18px 0 8px;padding-left:4px}

/* List */
.char-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px;margin-top:6px}
.chip{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:12px;font-size:24px;background:var(--paper);font-family:"Songti SC","STSong",serif;cursor:pointer;position:relative}
.chip .num{position:absolute;top:2px;left:5px;font-size:9px;color:var(--sub);font-family:-apple-system,sans-serif}
.chip.due{background:var(--accent-soft);border-color:var(--accent)}
.chip.learning{background:var(--amber-soft)}
.chip.mature{background:var(--green-soft)}

.searchbar{display:flex;gap:8px;margin-bottom:10px}
.searchbar input{flex:1;padding:10px 14px;border:1px solid var(--line);border-radius:999px;background:var(--paper);color:var(--ink);font-size:15px}

.dim{opacity:.6}
.center{text-align:center}

@media (min-width:900px){
  .stat-grid{grid-template-columns:repeat(4,1fr)}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>3000常用字 <span class="sub" id="header-sub"></span></h1>
    <button class="icon-btn" id="btn-settings" title="设置">⚙︎</button>
  </header>

  <main>

    <!-- QUIZ VIEW -->
    <section id="view-quiz" class="view active">
      <div class="card" id="quiz-card">
        <!-- filled by JS -->
      </div>
    </section>

    <!-- REVIEW VIEW -->
    <section id="view-review" class="view">
      <div class="card" id="review-card">
        <!-- filled by JS -->
      </div>
    </section>

    <!-- STATS VIEW -->
    <section id="view-stats" class="view">
      <div class="stat-grid">
        <div class="stat-card"><div class="num" id="s-tested">0</div><div class="lbl">已测验</div></div>
        <div class="stat-card"><div class="num" id="s-known">0</div><div class="lbl">认识</div></div>
        <div class="stat-card"><div class="num" id="s-deck">0</div><div class="lbl">复习卡库</div></div>
        <div class="stat-card"><div class="num" id="s-due">0</div><div class="lbl">今日待复习</div></div>
      </div>
      <div class="card" style="margin-top:14px">
        <div class="row"><div><b>测验进度</b></div><div class="spacer"></div><div class="muted" id="prog-text">0 / 2430</div></div>
        <div class="bar"><span id="prog-bar" style="width:0%"></span></div>
        <div class="legend">
          <span><span class="dot" style="background:var(--green)"></span>认识</span>
          <span><span class="dot" style="background:var(--accent)"></span>不认识</span>
          <span><span class="dot" style="background:var(--gray-soft);border:1px solid var(--line)"></span>未测</span>
        </div>
      </div>
      <div class="card">
        <div class="row"><b>SRS 卡库情况</b><div class="spacer"></div></div>
        <div class="legend" style="margin-top:14px">
          <span><span class="dot" style="background:var(--accent)"></span>新卡 <b id="s-new">0</b></span>
          <span><span class="dot" style="background:var(--amber)"></span>学习中 <b id="s-learning">0</b></span>
          <span><span class="dot" style="background:var(--green)"></span>已掌握 <b id="s-mature">0</b></span>
        </div>
        <div class="muted" style="margin-top:14px;font-size:12px">已掌握 = 复习间隔 ≥ 21 天</div>
      </div>
      <div class="section-title">复习卡库</div>
      <div class="searchbar">
        <input id="deck-search" placeholder="搜索字 / 拼音 / 编号">
        <select id="deck-filter" style="padding:10px 12px;border-radius:999px;border:1px solid var(--line);background:var(--paper);color:var(--ink)">
          <option value="all">全部</option>
          <option value="due">待复习</option>
          <option value="learning">学习中</option>
          <option value="mature">已掌握</option>
        </select>
      </div>
      <div id="deck-list" class="char-list"></div>
    </section>

    <!-- SETTINGS VIEW -->
    <section id="view-settings" class="view">
      <div class="card">
        <h3 style="margin-top:0">测验范围</h3>
        <div class="field">
          <label>从第几个字开始（按频率排序）</label>
          <div class="range-row">
            <input type="number" id="range-start" min="1" max="3000" value="1">
            <span class="muted">至</span>
            <input type="number" id="range-end" min="1" max="3000" value="3000">
          </div>
        </div>
        <div class="field">
          <label>每次测验：</label>
          <select id="quiz-mode-sel">
            <option value="unseen">优先未测过的</option>
            <option value="random">完全随机</option>
            <option value="unknown">只考曾不认识的</option>
          </select>
        </div>
      </div>

      <div class="card">
        <h3 style="margin-top:0">复习设置</h3>
        <div class="field">
          <label>每日新卡上限</label>
          <input type="number" id="daily-new-limit" min="0" max="500" value="20">
        </div>
        <div class="field">
          <label>每日复习上限</label>
          <input type="number" id="daily-review-limit" min="0" max="999" value="200">
        </div>
        <div class="toggle">
          <div>
            <div>认识时自动加入复习卡库</div>
            <div class="muted">若关闭，则只在你点"加入"时添加</div>
          </div>
          <div class="switch" id="toggle-auto-add"></div>
        </div>
      </div>

      <div class="card">
        <h3 style="margin-top:0">数据</h3>
        <div class="muted" style="margin-bottom:12px">本地保存在浏览器 localStorage 中。</div>
        <div class="row" style="gap:8px;flex-wrap:wrap">
          <button class="btn btn-ghost" id="btn-export">导出 JSON</button>
          <button class="btn btn-ghost" id="btn-import">导入 JSON</button>
          <input type="file" id="file-import" accept="application/json" style="display:none">
        </div>
        <div class="row" style="gap:8px;margin-top:10px">
          <button class="btn btn-ghost" id="btn-reset" style="color:var(--accent);border-color:var(--accent)">清空所有数据</button>
        </div>
      </div>

      <div class="card">
        <h3 style="margin-top:0">关于</h3>
        <p class="muted">本工具内置 2430 个高频汉字（基于《3000 常用字表》），数据存于本地，离线可用。</p>
        <p class="muted">复习算法：SM-2（Anki 同款间隔重复）。</p>
      </div>
    </section>

  </main>

  <nav class="tabs">
    <button class="tab active" data-view="quiz"><span class="ic">📝</span><span>测验</span></button>
    <button class="tab" data-view="review"><span class="ic">🔁</span><span>复习<span id="due-badge" class="badge" style="display:none">0</span></span></button>
    <button class="tab" data-view="stats"><span class="ic">📊</span><span>统计</span></button>
    <button class="tab" data-view="settings"><span class="ic">⚙︎</span><span>设置</span></button>
  </nav>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";

/* ================== DATA ================== */
const CHARS = JSON.parse(document.getElementById('chars-data').textContent);
const CHARS_BY_NUM = {};
CHARS.forEach(c => CHARS_BY_NUM[c.num] = c);
const ALL_NUMS = CHARS.map(c => c.num);

/* ================== STATE ================== */
const STORE_KEY = 'zi3000_v1';
const DEFAULT_STATE = {
  // tested[num] = 'known' | 'unknown'
  tested: {},
  // deck[num] = SM-2 card { ef, interval, reps, due (epoch ms), lapses }
  deck: {},
  settings: {
    rangeStart: 1,
    rangeEnd: 3000,
    quizMode: 'unseen',
    dailyNewLimit: 20,
    dailyReviewLimit: 200,
    autoAddOnKnown: false,
  },
  // daily counters: { date: 'YYYY-MM-DD', newCount: 0, reviewCount: 0 }
  daily: { date: '', newCount: 0, reviewCount: 0 },
};

let state = loadState();

function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return structuredClone(DEFAULT_STATE);
    const s = JSON.parse(raw);
    // Merge with defaults to add new keys
    return {
      tested: s.tested || {},
      deck: s.deck || {},
      settings: { ...DEFAULT_STATE.settings, ...(s.settings||{}) },
      daily: s.daily || { date:'', newCount:0, reviewCount:0 },
    };
  }catch(e){
    console.warn('load failed', e);
    return structuredClone(DEFAULT_STATE);
  }
}
function saveState(){
  localStorage.setItem(STORE_KEY, JSON.stringify(state));
}

function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function ensureDailyReset(){
  const t = todayStr();
  if(state.daily.date !== t){
    state.daily = { date: t, newCount: 0, reviewCount: 0 };
    saveState();
  }
}

/* ================== UI HELPERS ================== */
function $(sel){ return document.querySelector(sel); }
function $$(sel){ return Array.from(document.querySelectorAll(sel)); }
function toast(msg){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>t.classList.remove('show'), 1600);
}
function escapeHtml(s){ return s.replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* ================== TABS ================== */
$$('.tab').forEach(btn => {
  btn.addEventListener('click', () => {
    const v = btn.dataset.view;
    $$('.tab').forEach(b => b.classList.toggle('active', b===btn));
    $$('.view').forEach(s => s.classList.toggle('active', s.id === 'view-'+v));
    if(v==='quiz') renderQuiz();
    if(v==='review') renderReview();
    if(v==='stats') renderStats();
    if(v==='settings') renderSettings();
    updateHeader(v);
  });
});
$('#btn-settings').addEventListener('click', ()=>{
  document.querySelector('.tab[data-view="settings"]').click();
});
function updateHeader(v){
  const map = {quiz:'测验', review:'间隔复习', stats:'统计', settings:'设置'};
  $('#header-sub').textContent = map[v] || '';
}
updateHeader('quiz');

/* ================== QUIZ ================== */
let quizState = { current:null, revealed:false };

function pickQuizChar(){
  const {rangeStart, rangeEnd, quizMode} = state.settings;
  let pool = ALL_NUMS.filter(n => n>=rangeStart && n<=rangeEnd);
  if(quizMode==='unseen'){
    const unseen = pool.filter(n => !state.tested[n]);
    pool = unseen.length ? unseen : pool;
  }else if(quizMode==='unknown'){
    const unk = pool.filter(n => state.tested[n]==='unknown');
    if(!unk.length) return null;
    pool = unk;
  }
  if(!pool.length) return null;
  return CHARS_BY_NUM[pool[Math.floor(Math.random()*pool.length)]];
}

function renderQuiz(){
  ensureDailyReset();
  const card = $('#quiz-card');
  if(!quizState.current){
    quizState.current = pickQuizChar();
    quizState.revealed = false;
  }
  if(!quizState.current){
    card.innerHTML = `<div class="empty"><div class="ic">🎉</div>
      <h3>这个范围内的字都测过了</h3>
      <p>可在"设置"中扩大范围，或换成完全随机模式。</p>
      <button class="btn btn-pri" onclick="document.querySelector('.tab[data-view=settings]').click()">打开设置</button></div>`;
    return;
  }
  const c = quizState.current;
  const variantHtml = c.variant ? `<div class="variant">异体: ${escapeHtml(c.variant)}</div>` : '';

  if(!quizState.revealed){
    card.innerHTML = `
      <div class="char-stage">
        <div class="freq">第 ${c.num} 个最常用字</div>
        <div class="glyph">${escapeHtml(c.char)}</div>
        ${variantHtml}
      </div>
      <div class="muted center" style="margin:8px 0 4px">你认识这个字吗？</div>
      <div class="btn-row">
        <button class="btn btn-unknown" id="q-unk">不认识</button>
        <button class="btn btn-know" id="q-know">认识 ✓</button>
      </div>
      <div class="row" style="margin-top:10px;justify-content:center">
        <button class="btn-skip btn" style="padding:8px 16px;font-size:13px" id="q-skip">跳过</button>
      </div>
    `;
    $('#q-know').onclick = () => answerQuiz('known');
    $('#q-unk').onclick = () => answerQuiz('unknown');
    $('#q-skip').onclick = () => { quizState.current = null; renderQuiz(); };
  } else {
    const inDeck = !!state.deck[c.num];
    const pronsHtml = c.prons.map(p => renderPronBlock(p)).join('');

    card.innerHTML = `
      <div class="char-stage" style="padding-bottom:14px">
        <div class="freq">第 ${c.num} 个 · 你回答：${quizState.lastAnswer==='known' ? '<span style="color:var(--green)">认识</span>' : '<span style="color:var(--accent)">不认识</span>'}</div>
        <div class="glyph" style="font-size:96px">${escapeHtml(c.char)}</div>
        ${variantHtml}
      </div>
      <div class="reveal">${pronsHtml}</div>
      <div class="btn-row">
        ${inDeck
          ? `<button class="btn btn-skip" id="q-already">已在卡库 ✓</button>`
          : `<button class="btn btn-add" id="q-add">${quizState.lastAnswer==='unknown'?'➕ 加入复习卡库':'➕ 加入复习'}</button>`}
        <button class="btn btn-pri" id="q-next">下一题 →</button>
      </div>
    `;
    if(!inDeck){
      $('#q-add').onclick = () => {
        addToDeck(c.num);
        toast('已加入复习卡库');
        renderQuiz();
      };
    }
    $('#q-next').onclick = () => { quizState.current=null; renderQuiz(); };
  }
}

function answerQuiz(answer){
  const c = quizState.current;
  state.tested[c.num] = answer;
  quizState.lastAnswer = answer;
  // Auto-add unknown to deck always; known only if setting on
  if(answer==='unknown' && !state.deck[c.num]){
    addToDeck(c.num, /*silent*/true);
  } else if(answer==='known' && state.settings.autoAddOnKnown && !state.deck[c.num]){
    addToDeck(c.num, true);
  }
  saveState();
  quizState.revealed = true;
  renderQuiz();
  updateBadges();
}

// Split a PDF def into "leading meaning" (English) and "examples" (Chinese phrases).
// PDF has both mixed in one string; CC-CEDICT defs are clean lists.
function splitMeaningExamples(def){
  if(!def) return {head:'', examples:''};
  const idx = def.search(/[一-鿿]/);
  if(idx === -1) return {head:def, examples:''};
  const semiBefore = def.lastIndexOf(';', idx);
  if(semiBefore > 0){
    return {head:def.slice(0, semiBefore).trim(), examples:def.slice(semiBefore+1).trim()};
  }
  return {head:def.slice(0, idx).trim().replace(/[,;]\s*$/,''), examples:def.slice(idx).trim()};
}

function formatMeaning(s){
  let html = escapeHtml(s);
  html = html.replace(/([一-鿿]+)/g, '<span class="zh">$1</span>');
  return html;
}

// Render one pinyin reading with comprehensive English defs from CC-CEDICT
// + extra context/examples from the PDF source.
function renderPronBlock(p){
  const cedict = (p.cedict || []).map(s => s.trim()).filter(Boolean);
  const pdfRaw = p.pdf || p.def || '';
  const {head: pdfHead, examples: pdfExamples} = splitMeaningExamples(pdfRaw);

  let defsHtml = '';
  if(cedict.length){
    defsHtml = '<ul class="def-list">' +
      cedict.map(d => `<li>${escapeHtml(d)}</li>`).join('') +
      '</ul>';
  }

  // If PDF gives English context that CC-CEDICT lacks, show it as supplementary
  let pdfHeadHtml = '';
  const pdfHeadClean = pdfHead.replace(/^[\s,;]+/, '').trim();
  if(pdfHeadClean && (!cedict.length || pdfHeadClean.length > 3)){
    // Avoid duplicating obvious overlaps
    const lower = pdfHeadClean.toLowerCase();
    const dup = cedict.some(d => lower.includes(d.toLowerCase()) || d.toLowerCase().includes(lower));
    if(!cedict.length || !dup){
      pdfHeadHtml = `<div class="meaning">${formatMeaning(pdfHeadClean)}</div>`;
    }
  }

  let exHtml = '';
  if(pdfExamples){
    exHtml = `<div class="ex-label">词汇用法</div>
              <div class="examples">${formatMeaning(pdfExamples)}</div>`;
  }

  return `<div class="pron-block">
    <div class="pinyin-line"><span class="py">${escapeHtml(p.pinyin)}</span></div>
    ${defsHtml}
    ${pdfHeadHtml}
    ${exHtml}
  </div>`;
}

/* ================== SRS (SM-2) ================== */
const ONE_DAY = 86400000;

function newCard(){
  return { ef: 2.5, interval: 0, reps: 0, due: Date.now(), lapses: 0, added: Date.now() };
}
function addToDeck(num, silent){
  if(state.deck[num]) return;
  state.deck[num] = newCard();
  saveState();
  if(!silent) toast('已加入');
  updateBadges();
}
function removeFromDeck(num){
  delete state.deck[num];
  saveState();
  updateBadges();
}

// SM-2: quality 0-5. We map: again=1, hard=3, good=4, easy=5
function applySm2(card, quality){
  if(quality < 3){
    card.reps = 0;
    card.interval = 0;
    card.lapses = (card.lapses||0)+1;
    card.due = Date.now() + 10*60*1000; // 10 min relearn
    return card;
  }
  card.reps += 1;
  if(card.reps === 1) card.interval = 1;
  else if(card.reps === 2) card.interval = 6;
  else card.interval = Math.round(card.interval * card.ef);
  card.ef = card.ef + (0.1 - (5-quality)*(0.08 + (5-quality)*0.02));
  if(card.ef < 1.3) card.ef = 1.3;
  card.due = Date.now() + card.interval * ONE_DAY;
  return card;
}

function dueCards(){
  const now = Date.now();
  return Object.entries(state.deck)
    .filter(([n,c]) => c.due <= now)
    .map(([n,c]) => ({num: parseInt(n), card: c}))
    .sort((a,b) => a.card.due - b.card.due);
}

let reviewState = { current: null, revealed: false };

function pickReviewCard(){
  ensureDailyReset();
  const due = dueCards();
  if(!due.length) return null;
  // Respect daily review limit (count seen reviews); still show new cards up to limit
  const newCardsToday = state.daily.newCount || 0;
  const reviewsToday = state.daily.reviewCount || 0;
  // Separate new vs review
  const isNew = e => (e.card.reps||0) === 0 && (e.card.lapses||0)===0;
  const news = due.filter(isNew);
  const reps = due.filter(e => !isNew(e));
  if(reps.length && reviewsToday < state.settings.dailyReviewLimit){
    return reps[0];
  }
  if(news.length && newCardsToday < state.settings.dailyNewLimit){
    return news[0];
  }
  if(reps.length) return reps[0]; // exceed limit but still show
  if(news.length) return news[0];
  return null;
}

function renderReview(){
  ensureDailyReset();
  const card = $('#review-card');
  if(!reviewState.current){
    reviewState.current = pickReviewCard();
    reviewState.revealed = false;
  }
  const entry = reviewState.current;
  if(!entry){
    card.innerHTML = `<div class="empty"><div class="ic">✨</div>
      <h3>没有待复习的卡片</h3>
      <p>${Object.keys(state.deck).length===0 ? '先去"测验"标记不认识的字，加入卡库吧。' : '今日任务完成！明天再来。'}</p>
      <button class="btn btn-pri" onclick="document.querySelector('.tab[data-view=quiz]').click()">去测验</button></div>`;
    return;
  }
  const c = CHARS_BY_NUM[entry.num];
  const sm2 = entry.card;
  const ageInfo = sm2.reps===0 ? '新卡' : `已复习 ${sm2.reps} 次 · 当前间隔 ${sm2.interval} 天`;

  if(!reviewState.revealed){
    card.innerHTML = `
      <div class="char-stage">
        <div class="freq">${ageInfo}</div>
        <div class="glyph">${escapeHtml(c.char)}</div>
        ${c.variant ? `<div class="variant">异体: ${escapeHtml(c.variant)}</div>` : ''}
      </div>
      <div class="muted center" style="margin:8px 0">先在脑海里读一下、想想意思</div>
      <div class="btn-row" style="grid-template-columns:1fr">
        <button class="btn btn-pri" id="r-show">显示答案</button>
      </div>
    `;
    $('#r-show').onclick = () => { reviewState.revealed=true; renderReview(); };
  } else {
    const pronsHtml = c.prons.map(p => renderPronBlock(p)).join('');
    // Compute previews
    const sim = (q) => {
      const tmp = JSON.parse(JSON.stringify(sm2));
      applySm2(tmp, q);
      const days = Math.max(0, Math.round((tmp.due - Date.now())/ONE_DAY));
      if(q<3) return '<10分钟';
      if(days===0) return '今天';
      if(days===1) return '1天';
      return days+'天';
    };
    card.innerHTML = `
      <div class="char-stage" style="padding-bottom:14px">
        <div class="freq">${ageInfo}</div>
        <div class="glyph" style="font-size:96px">${escapeHtml(c.char)}</div>
      </div>
      <div class="reveal">${pronsHtml}</div>
      <div class="btn-row four">
        <button class="btn btn-srs btn-again" data-q="1"><span class="lbl">重来</span><span class="nxt">${sim(1)}</span></button>
        <button class="btn btn-srs btn-hard" data-q="3"><span class="lbl">难</span><span class="nxt">${sim(3)}</span></button>
        <button class="btn btn-srs btn-good" data-q="4"><span class="lbl">良好</span><span class="nxt">${sim(4)}</span></button>
        <button class="btn btn-srs btn-easy" data-q="5"><span class="lbl">简单</span><span class="nxt">${sim(5)}</span></button>
      </div>
      <div class="row" style="margin-top:14px;justify-content:center;gap:14px">
        <button class="btn-skip btn" style="padding:8px 16px;font-size:12px" id="r-remove">从卡库移除</button>
      </div>
    `;
    $$('.btn-srs').forEach(b => b.onclick = () => answerReview(parseInt(b.dataset.q)));
    $('#r-remove').onclick = () => {
      if(confirm('确定从复习卡库中移除这个字吗？')){
        removeFromDeck(entry.num);
        reviewState.current = null;
        renderReview();
      }
    };
  }
}

function answerReview(quality){
  const e = reviewState.current;
  const wasNew = (e.card.reps||0)===0 && (e.card.lapses||0)===0;
  applySm2(e.card, quality);
  ensureDailyReset();
  if(wasNew) state.daily.newCount = (state.daily.newCount||0)+1;
  else state.daily.reviewCount = (state.daily.reviewCount||0)+1;
  saveState();
  reviewState.current = null;
  renderReview();
  updateBadges();
}

function updateBadges(){
  const due = dueCards().length;
  const badge = $('#due-badge');
  if(due>0){ badge.textContent = due>99 ? '99+' : due; badge.style.display='inline-block'; }
  else badge.style.display='none';
}

/* ================== STATS ================== */
function renderStats(){
  ensureDailyReset();
  const tested = Object.keys(state.tested).length;
  const known = Object.values(state.tested).filter(v => v==='known').length;
  const unknown = tested - known;
  const deck = Object.keys(state.deck).length;
  const due = dueCards().length;
  $('#s-tested').textContent = tested;
  $('#s-known').textContent = known;
  $('#s-deck').textContent = deck;
  $('#s-due').textContent = due;
  const total = ALL_NUMS.length;
  $('#prog-text').textContent = tested+' / '+total;
  $('#prog-bar').style.width = (tested/total*100)+'%';

  // SRS breakdown
  let nNew=0, nLearn=0, nMature=0;
  Object.values(state.deck).forEach(c => {
    if((c.reps||0)===0 && (c.lapses||0)===0) nNew++;
    else if((c.interval||0) >= 21) nMature++;
    else nLearn++;
  });
  $('#s-new').textContent = nNew;
  $('#s-learning').textContent = nLearn;
  $('#s-mature').textContent = nMature;

  renderDeckList();
}

function renderDeckList(){
  const search = $('#deck-search').value.trim().toLowerCase();
  const filter = $('#deck-filter').value;
  const list = $('#deck-list');
  const now = Date.now();
  const items = Object.entries(state.deck).map(([n,c]) => ({num:parseInt(n), card:c, ch:CHARS_BY_NUM[parseInt(n)]}))
    .filter(x => x.ch);
  const filtered = items.filter(x => {
    const isDue = x.card.due <= now;
    const isMature = (x.card.interval||0) >= 21;
    const isLearning = !isDue && !isMature && (x.card.reps>0 || x.card.lapses>0);
    if(filter==='due' && !isDue) return false;
    if(filter==='mature' && !isMature) return false;
    if(filter==='learning' && !isLearning) return false;
    if(search){
      const s = search;
      return x.ch.char.includes(s) || x.ch.pinyin.toLowerCase().includes(s) || String(x.num).includes(s);
    }
    return true;
  }).sort((a,b)=>a.card.due-b.card.due);

  if(!filtered.length){
    list.innerHTML = '<div class="muted center" style="grid-column:1/-1;padding:30px 0">空</div>';
    return;
  }
  list.innerHTML = filtered.slice(0, 600).map(x => {
    const isDue = x.card.due <= now;
    const isMature = (x.card.interval||0) >= 21;
    let cls = '';
    if(isDue) cls='due';
    else if(isMature) cls='mature';
    else cls='learning';
    return `<div class="chip ${cls}" data-num="${x.num}" title="${x.ch.pinyin}"><span class="num">${x.num}</span>${escapeHtml(x.ch.char)}</div>`;
  }).join('');
  $$('.chip').forEach(el => {
    el.onclick = () => {
      const num = parseInt(el.dataset.num);
      const c = CHARS_BY_NUM[num];
      const card = state.deck[num];
      const days = Math.max(0, Math.round((card.due-Date.now())/ONE_DAY));
      const dueText = card.due<=Date.now() ? '现已待复习' : ('还有 '+days+' 天到期');
      const ok = confirm(`${c.char} (${c.pinyin}) #${num}\n复习 ${card.reps} 次 / 间隔 ${card.interval} 天 / EF ${card.ef.toFixed(2)}\n${dueText}\n\n点击确定从卡库移除`);
      if(ok){ removeFromDeck(num); renderStats(); }
    };
  });
}
$('#deck-search')?.addEventListener('input', renderDeckList);
$('#deck-filter')?.addEventListener('change', renderDeckList);

/* ================== SETTINGS ================== */
function renderSettings(){
  const s = state.settings;
  $('#range-start').value = s.rangeStart;
  $('#range-end').value = s.rangeEnd;
  $('#quiz-mode-sel').value = s.quizMode;
  $('#daily-new-limit').value = s.dailyNewLimit;
  $('#daily-review-limit').value = s.dailyReviewLimit;
  $('#toggle-auto-add').classList.toggle('on', s.autoAddOnKnown);
}
function bindSettings(){
  ['range-start','range-end','daily-new-limit','daily-review-limit'].forEach(id=>{
    $('#'+id).addEventListener('change', e => {
      const v = parseInt(e.target.value)||0;
      const map = {'range-start':'rangeStart','range-end':'rangeEnd','daily-new-limit':'dailyNewLimit','daily-review-limit':'dailyReviewLimit'};
      state.settings[map[id]] = v;
      saveState();
    });
  });
  $('#quiz-mode-sel').addEventListener('change', e=>{
    state.settings.quizMode = e.target.value;
    saveState();
    quizState.current = null;
  });
  $('#toggle-auto-add').addEventListener('click', e=>{
    state.settings.autoAddOnKnown = !state.settings.autoAddOnKnown;
    saveState();
    renderSettings();
  });
  $('#btn-reset').addEventListener('click', ()=>{
    if(confirm('确定清空所有进度和复习卡库？此操作不可恢复。')){
      localStorage.removeItem(STORE_KEY);
      state = loadState();
      toast('已清空');
      renderSettings();
      updateBadges();
    }
  });
  $('#btn-export').addEventListener('click', ()=>{
    const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '3000zi-backup-'+todayStr()+'.json';
    a.click();
    URL.revokeObjectURL(a.href);
  });
  $('#btn-import').addEventListener('click', ()=> $('#file-import').click());
  $('#file-import').addEventListener('change', e=>{
    const f = e.target.files[0];
    if(!f) return;
    const r = new FileReader();
    r.onload = ev => {
      try{
        const obj = JSON.parse(ev.target.result);
        if(!obj.tested || !obj.deck) throw new Error('格式错误');
        if(!confirm('确定导入并覆盖当前数据？')) return;
        state = { ...DEFAULT_STATE, ...obj, settings:{...DEFAULT_STATE.settings, ...(obj.settings||{})} };
        saveState();
        toast('导入成功');
        renderSettings(); updateBadges();
      }catch(err){ alert('导入失败: '+err.message); }
    };
    r.readAsText(f);
  });
}
bindSettings();

/* ================== INIT ================== */
ensureDailyReset();
renderQuiz();
updateBadges();

// Re-render when becoming visible (in case left open across days)
document.addEventListener('visibilitychange', ()=>{
  if(!document.hidden){
    ensureDailyReset();
    updateBadges();
  }
});
</script>
